<style>
:root{--bg:#eef3f8;--card:rgba(255,255,255,.94);--text:#172033;--muted:#718096;--line:#dfe7ef;--brand:#10253f;--brand2:#173b64;--accent:#2563eb;--accent-soft:#eaf2ff;--ok:#15803d;--warn:#c46a12;--bad:#c2414a;--purple:#7557d3;--shadow:0 14px 35px rgba(27,50,79,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#f7faff 0,#edf3f8 58%,#f4f7fb 100%);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:260px;background:linear-gradient(180deg,var(--brand),#0d1b2d);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh;box-shadow:10px 0 35px rgba(16,37,63,.08)}.brand{font-size:20px;font-weight:900;padding:7px 10px 18px;letter-spacing:.02em}.brand::after{content:"CONTROL CENTER";display:block;font-size:9px;letter-spacing:.18em;color:#7fa8d4;margin-top:5px;font-weight:700}.owner-title{font-size:11px;color:#85a2c2;padding:13px 10px 7px;letter-spacing:.08em}.owner-tabs{display:flex;flex-direction:column;gap:6px}.owner-tab,.nav-btn{border:0;background:transparent;color:#c7d4e5;text-align:left;border-radius:12px;padding:11px 12px;transition:.18s ease}.owner-tab:hover,.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}.owner-tab.active,.nav-btn.active{background:#fff;color:#14304f;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.15)}.owner-tab .count{float:right;color:#8296ad;font-size:12px}.main{flex:1;padding:26px 28px 44px;min-width:0}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px;padding:4px 2px}.title h1{margin:0;font-size:28px;letter-spacing:-.02em}.subtitle{color:var(--muted);margin-top:5px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-weight:750;color:#24364b;box-shadow:0 3px 10px rgba(30,55,80,.035);transition:.16s ease}.btn:hover{transform:translateY(-1px);border-color:#c8d6e5;box-shadow:0 8px 18px rgba(30,55,80,.08)}.btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-color:#2563eb}.btn.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.kpi{background:var(--card);border:1px solid rgba(218,228,238,.95);border-radius:18px;padding:18px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}.kpi::before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(#2e75ff,#69a4ff)}.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .value{font-size:29px;font-weight:900;margin-top:8px;letter-spacing:-.03em}.section{background:var(--card);border:1px solid rgba(218,228,238,.96);border-radius:19px;box-shadow:var(--shadow);padding:19px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.section h2{font-size:17px;margin:0}.section h3{color:#233550}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.field label{display:block;font-size:12px;color:#627389;margin-bottom:6px;font-weight:750}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d6e0ea;border-radius:11px;background:#fbfdff;color:#1f2d40;outline:none;transition:.15s}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa7eb;box-shadow:0 0 0 3px rgba(37,99,235,.08);background:#fff}.field textarea{min-height:90px;resize:vertical}.code-entry{display:flex;align-items:stretch}.code-prefix{display:flex;align-items:center;justify-content:center;min-width:48px;padding:0 12px;border:1px solid #bcd0e7;border-right:0;border-radius:11px 0 0 11px;background:#edf5ff;color:#1f5cab;font-weight:900;font-size:17px}.code-entry input{border-radius:0 11px 11px 0!important}.discount-input-wrap{position:relative;display:block}.discount-input-wrap .discount-input{display:block}.discount-input-wrap::before{content:"−";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#b91c1c;font-weight:800;font-size:18px;pointer-events:none}.field input.discount-input{padding-left:30px;color:#b91c1c;border-color:#fecaca;background:#fff7f7;font-weight:800}.discount-value{color:#b91c1c;font-weight:800}.table-wrap{overflow:auto;border:1px solid #e5ebf2;border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}.table th,.table td{padding:11px 10px;border-bottom:1px solid #e9eef4;text-align:left;white-space:nowrap;font-size:13px}.table th{font-size:11px;color:#718096;background:#f7fafe;text-transform:none;letter-spacing:.02em}.table tbody tr:hover{background:#f8fbff}.pill{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.pill.ok{background:#e9f8ef;color:#16733a}.pill.warn{background:#fff3df;color:#a8550a}.pill.bad{background:#feecef;color:#a5303b}.charts{display:grid;grid-template-columns:1.35fr .85fr;gap:15px}.chart-box{position:relative;height:360px}.chart-box.small{height:315px}.chart-card{background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid #e1e9f1;border-radius:16px;padding:16px}.chart-card h3{margin:0 0 4px;font-size:15px}.chart-card p{margin:0 0 14px;font-size:12px;color:var(--muted)}.bar{height:10px;background:#e8eef5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:999px}.empty{text-align:center;color:var(--muted);padding:32px}.modal-backdrop{position:fixed;inset:0;background:rgba(12,26,43,.48);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{background:#fff;width:min(740px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 28px 70px rgba(15,38,64,.28)}.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#dbeafe 0,transparent 35%),linear-gradient(135deg,#edf4fb,#f9fbfe)}.login-card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid #dfe9f3;box-shadow:0 25px 60px rgba(31,58,88,.13);border-radius:22px;padding:30px}.toast{position:fixed;right:18px;bottom:18px;background:#10253f;color:white;padding:12px 15px;border-radius:11px;display:none;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.18)}.muted{color:var(--muted)}.split{display:flex;gap:8px;align-items:center}.payment-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.checkout-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:13px;border:1px solid #dfe8f1;border-radius:14px;background:#f7faff}.checkout-summary b{display:block;font-size:20px;margin-top:4px}.report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.report-chip{padding:13px 15px;border:1px solid #e1e8f0;border-radius:14px;background:#f9fbfe}.report-chip span{font-size:11px;color:var(--muted);font-weight:700}.report-chip b{display:block;font-size:20px;margin-top:4px}.hide{display:none!important}@media(max-width:1050px){.side{width:218px}.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:static;width:auto;height:auto;padding:12px}.owner-tabs{flex-direction:row;overflow:auto}.owner-tab{white-space:nowrap}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.report-summary{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-backdrop"></div>
<script>
const CONFIG={SUPABASE_URL:'https://juspbhysjkqwzfccrnhb.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_SlN9cUzDYke3Mh2cmaBJxA_wnX5Pv7R'};
let sb=null,session=null,owners=[],bundles=[],sales=[],selectedOwner='ALL',editingId=null,currentView='overview',chartInstances=[];
const LOGIN_EMAILS={boss:'boss@internal.app',jen:'jen@internal.app'};
function appRole(){return session?.user?.app_metadata?.app_role||''}
function username(){return session?.user?.user_metadata?.username||Object.entries(LOGIN_EMAILS).find(([,e])=>e===session?.user?.email)?.[0]||session?.user?.email||''}
function isEngineer(){return appRole()==='jen'}
function requireEngineer(){if(!isEngineer()){toast('此功能僅限 jen 工程師帳號');return false}return true}
const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function configured(){return CONFIG.SUPABASE_URL.startsWith('http')&&!CONFIG.SUPABASE_URL.includes('YOUR_')&&CONFIG.SUPABASE_PUBLISHABLE_KEY&&!CONFIG.SUPABASE_PUBLISHABLE_KEY.includes('YOUR_')}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function shell(){const roleLabel=isEngineer()?'最高權限｜工程師':'營運管理權限';const managementMode=currentView==='owners';const topActions=managementMode?`<button class="btn" onclick="loadAll()">↻ 重新整理</button>`:`<button class="btn" onclick="loadAll()">↻ 重新整理</button><button class="btn" onclick="openImportForm()">⇧ Excel 匯入</button><button class="btn" onclick="openBundleForm()">＋ 新增套組</button><button class="btn primary" onclick="openSaleForm()">＋ 新增銷售</button>`;document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand">失控寄抽管理系統</div><div class="owner-title">營運對象</div><div id="owners" class="owner-tabs"></div><div class="owner-title">營運功能</div><div class="owner-tabs"><button class="nav-btn ${currentView==='overview'?'active':''}" onclick="setView('overview')">📊 營運總覽</button><button class="nav-btn ${currentView==='bundles'?'active':''}" onclick="setView('bundles')">📦 套組管理</button><button class="nav-btn ${currentView==='sales'?'active':''}" onclick="setView('sales')">📈 銷售分析</button><button class="nav-btn ${currentView==='reports'?'active':''}" onclick="setView('reports')">🧾 月結報表</button></div><div class="owner-title" style="margin-top:10px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">總管理區</div><div class="owner-tabs"><button class="nav-btn ${currentView==='owners'?'active':''}" onclick="setView('owners')">👥 老闆管理</button></div><div style="margin-top:18px;padding:10px;color:#9ca3af;font-size:12px"><b style="color:white">${esc(username())}</b><br>${roleLabel}<br><button class="btn" style="margin-top:8px;width:100%" onclick="logout()">登出</button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">全部老闆</h1><div id="pageSubtitle" class="subtitle">雲端資料庫｜套組、銷售、營收即時同步</div></div><div class="actions">${topActions}</div></div><div id="content"></div></main></div>`;renderOwners();renderContent();}
function setView(view){currentView=view;shell()}
function clearCharts(){for(const c of chartInstances){try{c.destroy()}catch(e){}}chartInstances=[]}
async function init(){if(!configured()){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">這個版本已完成 Supabase 對接。現在還缺你的 Supabase URL 與 Publishable Key；請編輯本檔最上方 CONFIG，或依附檔 README 完成設定。</p><p style="font-size:13px">資料表、RLS 權限與 Excel 匯入 SQL 都已準備好。</p><button class="btn primary" onclick="location.reload()">設定完成後重新載入</button></div></div>`;return}
sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); const r=await sb.auth.getSession();session=r.data.session;if(!session){showLogin();return} await loadAll();}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login"><form class="login-card" onsubmit="login(event)"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">請使用系統帳號與密碼登入。</p><div class="field" style="margin-bottom:10px"><label>帳號</label><input id="luser" autocomplete="username" placeholder="輸入帳號" required></div><div class="field"><label>密碼</label><input id="lpass" type="password" autocomplete="current-password" placeholder="輸入密碼" required></div><div class="modal-actions"><button class="btn primary">登入</button></div></form></div>`}
async function login(e){e.preventDefault();const u=luser.value.trim().toLowerCase();const email=LOGIN_EMAILS[u];if(!email)return toast('帳號或密碼錯誤');const {data,error}=await sb.auth.signInWithPassword({email,password:lpass.value});if(error)return toast('帳號或密碼錯誤');session=data.session;if(!['boss','jen'].includes(appRole())){await sb.auth.signOut();session=null;return toast('此帳號沒有系統權限')}await loadAll()}
async function logout(){await sb.auth.signOut();session=null;showLogin()}
async function loadAll(){const [o,b,s,r]=await Promise.all([sb.from('owners').select('*').order('display_order').order('name'),sb.from('bundles').select('*').order('bundle_date',{ascending:false}),sb.from('sales').select('*').order('sale_date',{ascending:false}),sb.from('monthly_reports').select('*').order('report_month',{ascending:false})]);for(const x of [o,b,s,r])if(x.error)return toast(x.error.message);owners=(o.data||[]).sort((a,b)=>String(a.owner_code||'ZZZ').localeCompare(String(b.owner_code||'ZZZ'),'en',{sensitivity:'base'}));bundles=b.data||[];sales=s.data||[];monthlyReports=r.data||[];shell()}
function ownerName(id){return owners.find(o=>o.id===id)?.name||'未知老闆'}
function fmtDate(d){if(!d)return '未設定';const x=new Date(d+'T00:00:00');if(Number.isNaN(x.getTime()))return d;return x.toLocaleDateString('zh-TW')}
function daysUntil(d){if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');return Math.ceil((b-a)/86400000)}
function expiryPill(d){if(!d)return '<span class="pill warn">未設定</span>';const n=daysUntil(d);if(n<0)return '<span class="pill bad">已到期 '+esc(fmtDate(d))+'</span>';if(n<=7)return '<span class="pill bad">'+n+' 天後到期</span>';if(n<=30)return '<span class="pill warn">'+n+' 天後到期</span>';return '<span class="pill ok">'+esc(fmtDate(d))+'</span>'}
function renderOwners(){const box=document.getElementById('owners');const managementMode=currentView==='owners';box.innerHTML=`<button class="owner-tab ${!managementMode&&selectedOwner==='ALL'?'active':''}" onclick="selectOwner('ALL')">全部老闆 <span class="count">${bundles.length}</span></button>`+owners.map(o=>`<button class="owner-tab ${!managementMode&&selectedOwner===o.id?'active':''}" onclick="selectOwner('${o.id}')">${o.owner_code?`<b>${esc(o.owner_code)}</b>｜`:''}${esc(o.name)} <span class="count">${bundles.filter(b=>b.owner_id===o.id).length}</span></button>`).join('')}
function selectOwner(id){selectedOwner=id;if(currentView==='owners')currentView='overview';shell()}
function ownerFiltered(){return selectedOwner==='ALL'?{b:bundles,s:sales}: {b:bundles.filter(x=>x.owner_id===selectedOwner),s:sales.filter(x=>x.owner_id===selectedOwner)}}
function renderContent(){clearCharts();if(currentView==='bundles')return renderBundles();if(currentView==='sales')return renderSalesAnalytics();if(currentView==='reports')return renderMonthlyReports();if(currentView==='owners')return renderOwnerManager();return renderOverview()}
function salesStatsForBundles(b,s){
 const stats=new Map();
 const keyMap=new Map(b.map(x=>[`${x.owner_id}::${x.code}`,x.id]));
 for(const x of b)stats.set(x.id,{revenue:0,draws:0,salesCount:0,firstSale:null});
 let unlinkedRevenue=0,unlinkedDraws=0;
 for(const x of s){
  const bid=x.bundle_id||(x.bundle_code?keyMap.get(`${x.owner_id}::${x.bundle_code}`):null);
  if(bid&&stats.has(bid)){const st=stats.get(bid);st.revenue+=Number(x.revenue||0);st.draws+=Number(x.draws||0);st.salesCount++;if(x.sale_date&&(!st.firstSale||x.sale_date<st.firstSale))st.firstSale=x.sale_date;}
  else{unlinkedRevenue+=Number(x.revenue||0);unlinkedDraws+=Number(x.draws||0);}
 }
 return {stats,unlinkedRevenue,unlinkedDraws};
}
function derivedBundle(b,stats){const st=stats.get(b.id)||{revenue:0,draws:0,salesCount:0,firstSale:null};const hasSales=st.salesCount>0;return {...b,_revenue:st.revenue,_draws:st.draws,_salesCount:st.salesCount,_firstSale:st.firstSale,_profit:hasSales?st.revenue-Number(b.cost||0):0,_recognizedCost:hasSales?Number(b.cost||0):0};}

function parseDrawProgress(v){const t=String(v??'').trim();if(!t)return {done:0,total:null};if(t.includes('/')){const [a,b]=t.split('/',2);const da=Number((a.match(/\d+/)||['0'])[0]);const tb=(b.match(/\d+/)||[])[0];return {done:Number.isFinite(da)?da:0,total:tb?Number(tb):null};}const m=t.match(/\d+/);return {done:0,total:m?Number(m[0]):null};}
function totalDrawTarget(b){const n=Number(b.total_draw_target);if(Number.isFinite(n)&&n>0)return n;const m=String(b.draw_target||'').match(/\d+/);return m?Number(m[0]):null}
function drawProgress(b){const total=totalDrawTarget(b);return `${Number(b._draws||0)}/${total??'-'}`}
function renderOverview(){const {b,s}=ownerFiltered();document.getElementById('pageTitle').textContent=selectedOwner==='ALL'?'全部老闆':ownerName(selectedOwner);document.getElementById('pageSubtitle').textContent='雲端資料庫｜毛利由實際銷售紀錄計算';const calc=salesStatsForBundles(b,s),db=b.map(x=>derivedBundle(x,calc.stats));const revenue=s.reduce((a,x)=>a+Number(x.revenue||0),0);const cost=b.reduce((a,x)=>a+Number(x.cost||0),0);const profit=db.reduce((a,x)=>a+x._profit,0)+calc.unlinkedRevenue;const draws=s.reduce((a,x)=>a+Number(x.draws||0),0);const active=b.filter(x=>x.status==='進行中').length;const expOwners=(selectedOwner==='ALL'?owners:owners.filter(o=>o.id===selectedOwner)).filter(o=>o.draw_expiry_date).sort((a,b)=>String(a.draw_expiry_date).localeCompare(String(b.draw_expiry_date)));
const months={};for(const x of s){const m=(x.sale_date||'').slice(0,7)||'未知';months[m]=(months[m]||0)+Number(x.revenue||0)}const mkeys=Object.keys(months).sort().slice(-6);const max=Math.max(...mkeys.map(k=>months[k]),1);

document.getElementById('content').innerHTML=`<div class="grid"><div class="kpi"><div class="label">累計營收</div><div class="value">${money(revenue)}</div></div><div class="kpi"><div class="label">套組成本</div><div class="value">${money(cost)}</div></div><div class="kpi"><div class="label">毛利</div><div class="value">${money(profit)}</div></div><div class="kpi"><div class="label">已售抽數</div><div class="value">${draws}</div></div></div>
<div class="charts"><div class="section"><div class="section-head"><h2>月營收</h2><span class="muted">${active} 個進行中套組</span></div>${mkeys.length?mkeys.map(k=>`<div style="margin:12px 0"><div class="split" style="justify-content:space-between;font-size:13px"><span>${k}</span><b>${money(months[k])}</b></div><div class="bar" style="margin-top:6px"><span style="width:${months[k]/max*100}%"></span></div></div>`).join(''):'<div class="empty">尚無資料</div>'}</div>
</div>
<div class="section"><div class="section-head"><h2>套組</h2><button class="btn" onclick="openBundleForm()">＋ 新增</button></div><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>編號</th><th>品名</th><th>成本</th><th>收入</th><th>毛利</th><th>已刮 / 總刮</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.slice(0,30).map(x=>`<tr><td>${x.bundle_date||''}</td><td><b>${esc(x.code)}</b></td><td>${esc(x.product_name)}</td><td>${money(x.cost)}</td><td>${money(x._revenue)}</td><td>${money(x._profit)}</td><td>${drawProgress(x)}</td><td>${statusPill(x.status)}</td><td><button class="btn" onclick="openBundleForm('${x.id}')">編輯</button></td></tr>`).join('')}</tbody></table></div>${b.length>30?'<div class="muted" style="padding-top:10px">僅顯示最新 30 筆，完整資料可在下方銷售與套組管理中查詢。</div>':''}</div>

function bundleOptions(owner){const bs=bundles.filter(b=>(!owner||b.owner_id===owner)&&['進行中','直購'].includes(b.status));return `<option value="">選擇套組</option>`+bs.map(b=>{const derived=derivedBundle(b,salesStatsForBundles([b],sales.filter(s=>s.bundle_id===b.id)).stats);return `<option value="${b.id}" data-price="${esc(b.price||'')}">${esc(b.code)}｜${esc(b.product_name)}｜${drawProgress(derived)}</option>`}).join('')}

function fillSaleProduct(){const bundle=document.getElementById('sf_bundle'),price=document.getElementById('sf_price');if(!bundle||!price)return;const o=bundle.options[bundle.selectedIndex];if(!o||!o.value){price.value='';updateCheckoutSummary();return}const p=o.dataset.price||'';const m=p.match(/\d+(?:\.\d+)?/);price.value=m?m[0]:'';updateCheckoutSummary()}
function paymentMethodOptions(sel='現金'){return ['現金','轉帳','街口','LINEPAY','免單結束'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
function addPaymentRow(method='現金',amount=''){const box=document.getElementById('payment_rows');if(!box)return;const div=document.createElement('div');div.className='payment-row';div.innerHTML=`<div class="field"><label>方式</label><select class="pay-method" onchange="handlePaymentMethodChange(this)">${paymentMethodOptions(method)}</select></div><div class="field"><label>金額</label><input class="pay-amount" type="number" min="0" step="1" value="${esc(amount)}" oninput="updateCheckoutSummary()"></div><button class="btn danger" type="button" onclick="this.parentElement.remove();updateCheckoutSummary()">移除</button>`;box.appendChild(div);handlePaymentMethodChange(div.querySelector('.pay-method'));updateCheckoutSummary()}
function handlePaymentMethodChange(sel){const row=sel.closest('.payment-row');const amt=row?.querySelector('.pay-amount');const isFree=sel.value==='免單結束';if(amt){amt.disabled=isFree;amt.value=isFree?'0':amt.value}if(isFree){document.querySelectorAll('.payment-row').forEach(r=>{if(r!==row)r.remove()})}updateCheckoutSummary()}
function normalizeDiscountInput(){const el=document.getElementById('sf_discount');if(!el)return;const n=Math.abs(Number(el.value||0));if(Number.isFinite(n)&&Number(el.value||0)<0)el.value=String(n)}
function orderTotal(){return Math.max(0,Number(document.getElementById('sf_draws')?.value||0)*Number(document.getElementById('sf_price')?.value||0)-Math.abs(Number(document.getElementById('sf_discount')?.value||0)))}
function paymentRows(){return [...document.querySelectorAll('.payment-row')].map(r=>({method:r.querySelector('.pay-method').value,amount:Number(r.querySelector('.pay-amount').value||0)})).filter(x=>x.method==='免單結束'||x.amount>0)}
function updateCheckoutSummary(){const payments=paymentRows();const isFree=payments.some(x=>x.method==='免單結束');const total=isFree?0:orderTotal();const received=isFree?0:payments.reduce((a,x)=>a+x.amount,0);const change=received-total;const a=document.getElementById('sum_total'),b=document.getElementById('sum_received'),c=document.getElementById('sum_change');if(a)a.textContent=money(total);if(b)b.textContent=money(received);if(c)c.textContent=money(Math.max(change,0))}

function openImportForm(){
 document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>Excel 差異同步</h3><button class="btn" onclick="closeModal()">關閉</button></div><p class="muted">Excel 不再整批覆蓋資料庫。系統會先比對既有資料，只新增缺少項目、更新安全差異，資料庫中 Excel 沒出現的資料一律保留。</p><div class="form-grid"><div class="field"><label>資料所屬老闆</label><select id="imp_owner" required>${ownerOptions(selectedOwner==='ALL'?(owners[0]?.id||''):selectedOwner)}</select></div><div class="field"><label>Excel 檔案</label><input id="imp_file" type="file" accept=".xlsx,.xls" required></div><div class="field full"><label>差異同步規則</label><div class="muted" style="line-height:1.75">① 新套組：新增。既有套組：只更新 Excel 有值且確實不同的基本欄位。<br>② 狀態、結束日期：既有套組以網站資料庫為主，不被舊 Excel 覆蓋。<br>③ 歷史已刮數：只允許往前增加，不會被舊 Excel 往回蓋。<br>④ Excel 空白欄位不覆蓋資料庫已有內容；Excel 沒出現的資料也不刪除。<br>⑤ 銷售完全相同會略過；可明確辨識為同一筆的修改會更新；無法安全判斷的相似資料列為衝突，不自動亂改。<br>⑥ 匯入完成會顯示新增／更新／略過／衝突統計。</div></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary" onclick="importExcel()">開始差異同步</button></div><div id="imp_status" class="muted" style="margin-top:12px;line-height:1.6"></div></div>`;
 document.getElementById('modal').style.display='flex';
}
function xDate(v){if(v==null||v==='')return null;if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10)}if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10)}
function xNum(v){if(v==null||v===''||v==='#NAME?')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null}
function fingerprint(a){let str=a.map(v=>v==null?'':String(v).trim()).join('\u001f');let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0}return 'excel_'+(h>>>0).toString(16)+'_'+btoa(unescape(encodeURIComponent(str))).slice(0,80).replace(/[^a-zA-Z0-9_-]/g,'');}
async function importExcel(){
 const ownerId=document.getElementById('imp_owner').value;
 const file=document.getElementById('imp_file').files[0];
 const status=document.getElementById('imp_status');
 if(!file)return toast('請選擇 Excel');
 status.textContent='讀取 Excel 並比對資料庫中…';
 try{
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:'array',cellDates:true});
  const bSheet=wb.Sheets['套組'],sSheet=wb.Sheets['銷售紀錄'];
  if(!bSheet||!sSheet)throw new Error('找不到「套組」或「銷售紀錄」工作表');
  const bs=XLSX.utils.sheet_to_json(bSheet,{header:1,defval:null});
  const ss=XLSX.utils.sheet_to_json(sSheet,{header:1,defval:null});

  const {data:dbBundles,error:be}=await sb.from('bundles').select('id,owner_id,bundle_date,code,product_name,cost,draw_target,historical_draws,total_draw_target,status,price,end_date').eq('owner_id',ownerId);
  if(be)throw be;
  const dbBundleMap=new Map((dbBundles||[]).map(x=>[String(x.code||'').trim(),x]));

  const excelBundles=[];
  for(const r of bs.slice(1)){
   const code=r[1],name=r[2];
   if(!code||code==='#NAME?'||!name||name==='#NAME?')continue;
   const prog=parseDrawProgress(r[6]);
   excelBundles.push({
    owner_id:ownerId,code:String(code).trim(),product_name:String(name).trim(),
    bundle_date:xDate(r[0]),cost:xNum(r[3]),
    draw_target:r[6]==null||r[6]===''?null:String(r[6]),
    excel_done:prog.done,total_draw_target:prog.total,
    excel_status:['進行中','結束','免單結束','腰斬','直購'].includes(String(r[7]||''))?String(r[7]):null,
    price:r[9]==null||r[9]===''?null:xNum(r[9]),end_date:xDate(r[10])
   });
  }

  // 先建立名稱對照，解析銷售資料。
  const nameMap=new Map((dbBundles||[]).map(x=>[x.code,x.product_name]));
  for(const b of excelBundles)nameMap.set(b.code,b.product_name);
  const excelSales=[];let lastSaleDate=null;
  for(const r of ss.slice(1)){
   const rowDate=xDate(r[0]); if(rowDate)lastSaleDate=rowDate;
   const code=r[1]==null||r[1]===''||r[1]==='#NAME?'?null:String(r[1]).trim();
   const drawsRaw=xNum(r[3]),unitRaw=xNum(r[4]),discountRaw=xNum(r[5]);
   const payment=r[7]==null||String(r[7]).trim()===''?null:String(r[7]).trim();
   const staff=r[8]==null||String(r[8]).trim()===''?null:String(r[8]).trim();
   const note=r[9]==null||String(r[9]).trim()===''?null:String(r[9]).trim();
   const meaningful=!!code||drawsRaw!=null||unitRaw!=null||discountRaw!=null||!!payment||!!staff||!!note;
   if(!meaningful)continue;
   const dt=rowDate||lastSaleDate;if(!dt)throw new Error('銷售紀錄有資料但找不到日期，請在該筆或其上方補上日期');
   let name=(r[2]==null||r[2]===''||r[2]==='#NAME?'||String(r[2]).startsWith('='))?null:String(r[2]).trim();
   if(!name&&code)name=nameMap.get(code)||null; name=name||'未指定品名';
   const draws=Math.trunc(drawsRaw||0),unit=unitRaw||0,discount=discountRaw==null?0:-Math.abs(discountRaw);
   const base=[ownerId,dt,code,name,draws,unit,discount,payment,staff,note];
   excelSales.push({owner_id:ownerId,sale_date:dt,bundle_code:code,product_name:name,draws,unit_price:unit,discount,payment_method:payment,entered_by:staff,note,import_source_key:fingerprint(base)});
  }

  // Excel 的已刮 = 歷史基準 + Excel 本身已有的銷售抽數。
  const excelSalesDraws=new Map();
  for(const sr of excelSales)if(sr.bundle_code)excelSalesDraws.set(sr.bundle_code,(excelSalesDraws.get(sr.bundle_code)||0)+Number(sr.draws||0));

  let bundleNew=0,bundleUpdated=0,bundleSkipped=0;
  const bundleWrites=[];
  for(const eb of excelBundles){
   const old=dbBundleMap.get(eb.code);
   const baseline=Math.max(0,Number(eb.excel_done||0)-Number(excelSalesDraws.get(eb.code)||0));
   if(!old){
    bundleWrites.push({owner_id:ownerId,code:eb.code,product_name:eb.product_name,bundle_date:eb.bundle_date,cost:eb.cost??0,draw_target:eb.draw_target,historical_draws:baseline,total_draw_target:eb.total_draw_target,status:eb.excel_status||'進行中',price:eb.price,end_date:eb.end_date});
    bundleNew++;continue;
   }
   // Merge：保護網站上維護的狀態／結束日期；空白 Excel 不覆蓋；歷史刮數只能增加。
   const merged={
    owner_id:ownerId,code:old.code,
    product_name:eb.product_name||old.product_name,
    bundle_date:eb.bundle_date||old.bundle_date,
    cost:eb.cost==null?old.cost:eb.cost,
    draw_target:eb.draw_target==null?old.draw_target:eb.draw_target,
    historical_draws:Math.max(Number(old.historical_draws||0),baseline),
    total_draw_target:eb.total_draw_target==null?old.total_draw_target:eb.total_draw_target,
    status:old.status,
    price:eb.price==null?old.price:eb.price,
    end_date:old.end_date
   };
   const changed=['product_name','bundle_date','cost','draw_target','historical_draws','total_draw_target','price'].some(k=>String(merged[k]??'')!==String(old[k]??''));
   if(changed){bundleWrites.push(merged);bundleUpdated++;}else bundleSkipped++;
  }
  if(bundleWrites.length){
   status.textContent=`套組差異：新增 ${bundleNew}、更新 ${bundleUpdated}、略過 ${bundleSkipped}。寫入中…`;
   const q=await sb.from('bundles').upsert(bundleWrites,{onConflict:'owner_id,code'});if(q.error)throw q.error;
  }

  // 重新取套組 ID，供新增銷售關聯。
  const {data:freshBundles,error:fbe}=await sb.from('bundles').select('id,code,product_name').eq('owner_id',ownerId);if(fbe)throw fbe;
  const idMap=new Map((freshBundles||[]).map(x=>[x.code,x]));
  for(const sr of excelSales)sr.bundle_id=sr.bundle_code&&idMap.has(sr.bundle_code)?idMap.get(sr.bundle_code).id:null;

  const {data:dbSales,error:se}=await sb.from('sales').select('id,sale_date,bundle_code,product_name,draws,unit_price,discount,payment_method,entered_by,note,import_source_key').eq('owner_id',ownerId);
  if(se)throw se;
  const exactKeys=new Set((dbSales||[]).map(x=>x.import_source_key).filter(Boolean));
  const candidateMap=new Map();
  const stableKey=x=>[x.sale_date||'',x.bundle_code||'',x.entered_by||'',x.note||''].join('\u001f');
  for(const x of dbSales||[]){const k=stableKey(x);if(!candidateMap.has(k))candidateMap.set(k,[]);candidateMap.get(k).push(x);}

  let saleNew=0,saleUpdated=0,saleSkipped=0,saleConflicts=0;
  const saleInserts=[],saleUpdates=[];
  for(const sr of excelSales){
   if(exactKeys.has(sr.import_source_key)){saleSkipped++;continue;}
   const candidates=candidateMap.get(stableKey(sr))||[];
   // 僅在候選唯一時，才視為同一筆舊銷售的修改；避免誤改同日多筆訂單。
   if(candidates.length===1){
    const old=candidates[0];
    const differs=['product_name','draws','unit_price','discount','payment_method'].some(k=>String(old[k]??'')!==String(sr[k]??''));
    if(differs){saleUpdates.push({...sr,id:old.id});saleUpdated++;}else saleSkipped++;
   }else if(candidates.length>1){
    saleConflicts++;
   }else{saleInserts.push(sr);saleNew++;}
  }

  for(const u of saleUpdates){
   const {id,...payload}=u;
   const q=await sb.from('sales').update(payload).eq('id',id);if(q.error)throw q.error;
  }
  for(let i=0;i<saleInserts.length;i+=100){
   const chunk=saleInserts.slice(i,i+100);const q=await sb.from('sales').insert(chunk);if(q.error)throw q.error;
  }

  const msg=`差異同步完成｜套組：新增 ${bundleNew}、更新 ${bundleUpdated}、略過 ${bundleSkipped}｜銷售：新增 ${saleNew}、更新 ${saleUpdated}、略過 ${saleSkipped}、衝突 ${saleConflicts}`;
  status.textContent=msg+(saleConflicts?'。衝突資料未自動寫入，避免誤覆蓋。':'');
  toast(msg);
  setTimeout(async()=>{closeModal();await loadAll()},900);
 }catch(err){status.textContent='同步失敗：'+(err.message||err);toast(err.message||'Excel 差異同步失敗')}
}

 if(!months.length)return;
 setTimeout(()=>{

   const ctx2=document.getElementById('latestShareChart');if(ctx2){let labels,data;if(selectedOwner==='ALL'){labels=latestRows.map(r=>ownerName(r.owner_id));data=latestRows.map(r=>Number(r.revenue||0))}else{const r=latestRows[0]||{};labels=['營收','認列成本','毛利'];data=[Number(r.revenue||0),Number(r.recognized_cost||0),Math.max(0,Number(r.profit||0))]}chartInstances.push(new Chart(ctx2,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:['#2563eb','#f59e0b','#10b981','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316']}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom'}}}}))}

async function saveOwnerExpiry(id){const d=document.getElementById('owner_expiry_date').value||null;const q=await sb.rpc('update_owner_expiry',{p_owner_id:id,p_expiry_date:d});if(q.error)return toast(q.error.message);toast('寄抽到期日已更新');closeModal();await loadAll()}
function addOwner(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>新增老闆</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveNewOwner(event)"><div class="form-grid"><div class="field"><label>老闆名稱</label><input id="new_owner_name" required></div><div class="field"><label>英文編碼</label><input id="new_owner_code" maxlength="8" placeholder="例如 B" style="text-transform:uppercase" required></div><div class="field"><label>寄抽到期日</label><input id="new_owner_expiry" type="date"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">新增</button></div></form></div>`;document.getElementById('modal').style.display='flex'}
async function saveNewOwner(e){e.preventDefault();const name=new_owner_name.value.trim();const code=new_owner_code.value.trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{0,7}$/.test(code))return toast('英文編碼需以英文字母開頭，最多 8 碼');const max=Math.max(0,...owners.map(x=>x.display_order||0));const q=await sb.from('owners').insert({name,owner_code:code,draw_expiry_date:new_owner_expiry.value||null,display_order:max+1,active:true});if(q.error)return toast(q.error.message);toast('老闆已新增');closeModal();await loadAll()}
function editOwner(id){if(!isEngineer())return;const o=owners.find(x=>x.id===id);if(!o)return;document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>編輯老闆</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveOwnerEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>老闆名稱</label><input id="edit_owner_name" value="${esc(o.name)}" required></div><div class="field"><label>英文編碼</label><input id="edit_owner_code" maxlength="8" value="${esc(o.owner_code||'')}" style="text-transform:uppercase" required></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">儲存</button></div></form></div>`;document.getElementById('modal').style.display='flex'}
async function saveOwnerEdit(e,id){e.preventDefault();const code=edit_owner_code.value.trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{0,7}$/.test(code))return toast('英文編碼格式錯誤');const q=await sb.from('owners').update({name:edit_owner_name.value.trim(),owner_code:code}).eq('id',id);if(q.error)return toast(q.error.message);toast('老闆資料已更新');closeModal();await loadAll()}
async function toggleOwner(id,active){const q=await sb.from('owners').update({active}).eq('id',id);if(q.error)return toast(q.error.message);await loadAll()}
window.addEventListener('load',init);
</script>
</body></html>
