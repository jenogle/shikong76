<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#151823;--muted:#6b7280;--line:#e7e9ef;--brand:#1f2937;--accent:#111827;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--shadow:0 12px 30px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:252px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;padding:6px 10px 18px}.owner-title{font-size:12px;color:#9ca3af;padding:12px 10px 8px}.owner-tabs{display:flex;flex-direction:column;gap:7px}.owner-tab,.nav-btn{border:0;background:transparent;color:#d1d5db;text-align:left;border-radius:10px;padding:11px 12px}.owner-tab:hover,.nav-btn:hover{background:#1f2937;color:white}.owner-tab.active,.nav-btn.active{background:#fff;color:#111827;font-weight:700}.owner-tab .count{float:right;color:#9ca3af;font-size:12px}.main{flex:1;padding:24px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:25px}.subtitle{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;font-weight:700}.btn.primary{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.section{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.section h2{font-size:17px;margin:0}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9dce5;border-radius:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}.table th{font-size:12px;color:var(--muted);background:#fafafa}.pill{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.pill.ok{background:#ecfdf3;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fef2f2;color:#991b1b}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart-box{position:relative;height:340px}.chart-box.small{height:280px}.bar{height:12px;background:#eef0f4;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#111827;border-radius:999px}.empty{text-align:center;color:var(--muted);padding:30px}.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{background:white;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px}.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:28px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:11px 14px;border-radius:10px;display:none;z-index:80}.muted{color:var(--muted)}.split{display:flex;gap:8px;align-items:center}.hide{display:none!important}@media(max-width:1000px){.side{width:205px}.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:static;width:auto;height:auto;padding:12px}.owner-tabs{flex-direction:row;overflow:auto}.owner-tab{white-space:nowrap}.main{padding:14px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
</style>

<div id="modal" class="modal-backdrop"></div>
<script>
const CONFIG={SUPABASE_URL:'https://juspbhysjkqwzfccrnhb.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_SlN9cUzDYke3Mh2cmaBJxA_wnX5Pv7R'};
let sb=null,session=null,owners=[],bundles=[],sales=[],selectedOwner='ALL',editingId=null,currentView='overview',chartInstances=[];
const LOGIN_EMAILS={boss:'boss@internal.app',jen:'jen@internal.app'};
function appRole(){return session?.user?.app_metadata?.app_role||''}
function username(){return session?.user?.user_metadata?.username||Object.entries(LOGIN_EMAILS).find(([,e])=>e===session?.user?.email)?.[0]||session?.user?.email||''}
function isEngineer(){return appRole()==='jen'}
function requireEngineer(){if(!isEngineer()){toast('此功能僅限 jen 工程師帳號');return false}return true}
const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function configured(){return CONFIG.SUPABASE_URL.startsWith('http')&&!CONFIG.SUPABASE_URL.includes('YOUR_')&&CONFIG.SUPABASE_PUBLISHABLE_KEY&&!CONFIG.SUPABASE_PUBLISHABLE_KEY.includes('YOUR_')}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function shell(){const roleLabel=isEngineer()?'最高權限｜工程師':'營運管理權限';document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand">失控寄抽管理系統</div><div class="owner-title">老闆分頁</div><div id="owners" class="owner-tabs"></div><div class="owner-title">功能</div><div class="owner-tabs"><button class="nav-btn ${currentView==='overview'?'active':''}" onclick="setView('overview')">📊 營運總覽</button><button class="nav-btn ${currentView==='bundles'?'active':''}" onclick="setView('bundles')">📦 套組管理</button><button class="nav-btn ${currentView==='sales'?'active':''}" onclick="setView('sales')">📈 銷售分析</button>${isEngineer()?`<button class="nav-btn ${currentView==='owners'?'active':''}" onclick="setView('owners')">👥 老闆管理</button>`:''}</div><div style="margin-top:18px;padding:10px;color:#9ca3af;font-size:12px"><b style="color:white">${esc(username())}</b><br>${roleLabel}<br><button class="btn" style="margin-top:8px;width:100%" onclick="logout()">登出</button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">全部老闆</h1><div id="pageSubtitle" class="subtitle">雲端資料庫｜套組、銷售、營收即時同步</div></div><div class="actions"><button class="btn" onclick="loadAll()">↻ 重新整理</button><button class="btn" onclick="openImportForm()">⇧ Excel 匯入</button><button class="btn" onclick="openBundleForm()">＋ 新增套組</button><button class="btn primary" onclick="openSaleForm()">＋ 新增銷售</button></div></div><div id="content"></div></main></div>`;renderOwners();renderContent();}
function setView(view){currentView=view;shell()}
function clearCharts(){for(const c of chartInstances){try{c.destroy()}catch(e){}}chartInstances=[]}
async function init(){if(!configured()){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">這個版本已完成 Supabase 對接。現在還缺你的 Supabase URL 與 Publishable Key；請編輯本檔最上方 CONFIG，或依附檔 README 完成設定。</p><p style="font-size:13px">資料表、RLS 權限與 Excel 匯入 SQL 都已準備好。</p><button class="btn primary" onclick="location.reload()">設定完成後重新載入</button></div></div>`;return}
sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); const r=await sb.auth.getSession();session=r.data.session;if(!session){showLogin();return} await loadAll();}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login"><form class="login-card" onsubmit="login(event)"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">請使用系統帳號與密碼登入。</p><div class="field" style="margin-bottom:10px"><label>帳號</label><input id="luser" autocomplete="username" placeholder="輸入帳號" required></div><div class="field"><label>密碼</label><input id="lpass" type="password" autocomplete="current-password" placeholder="輸入密碼" required></div><div class="modal-actions"><button class="btn primary">登入</button></div></form></div>`}
async function login(e){e.preventDefault();const u=luser.value.trim().toLowerCase();const email=LOGIN_EMAILS[u];if(!email)return toast('帳號或密碼錯誤');const {data,error}=await sb.auth.signInWithPassword({email,password:lpass.value});if(error)return toast('帳號或密碼錯誤');session=data.session;if(!['boss','jen'].includes(appRole())){await sb.auth.signOut();session=null;return toast('此帳號沒有系統權限')}await loadAll()}
async function logout(){await sb.auth.signOut();session=null;showLogin()}
async function loadAll(){const [o,b,s]=await Promise.all([sb.from('owners').select('*').order('display_order').order('name'),sb.from('bundles').select('*').order('bundle_date',{ascending:false}),sb.from('sales').select('*').order('sale_date',{ascending:false})]);for(const x of [o,b,s])if(x.error)return toast(x.error.message);owners=o.data||[];bundles=b.data||[];sales=s.data||[];shell()}
function ownerName(id){return owners.find(o=>o.id===id)?.name||'未分配'}
function renderOwners(){const box=document.getElementById('owners');box.innerHTML=`<button class="owner-tab ${selectedOwner==='ALL'?'active':''}" onclick="selectOwner('ALL')">全部老闆 <span class="count">${bundles.length}</span></button>`+owners.map(o=>`<button class="owner-tab ${selectedOwner===o.id?'active':''}" onclick="selectOwner('${o.id}')">${esc(o.name)} <span class="count">${bundles.filter(b=>b.owner_id===o.id).length}</span></button>`).join('')}
function selectOwner(id){selectedOwner=id;renderOwners();renderContent()}
function ownerFiltered(){return selectedOwner==='ALL'?{b:bundles,s:sales}: {b:bundles.filter(x=>x.owner_id===selectedOwner),s:sales.filter(x=>x.owner_id===selectedOwner)}}
function renderContent(){clearCharts();if(currentView==='bundles')return renderBundles();if(currentView==='sales')return renderSalesAnalytics();if(currentView==='owners')return renderOwnerManager();return renderOverview()}
function salesStatsForBundles(b,s){
 const stats=new Map();
 const keyMap=new Map(b.map(x=>[`${x.owner_id}::${x.code}`,x.id]));
 for(const x of b)stats.set(x.id,{revenue:0,draws:0,salesCount:0,firstSale:null});
 let unlinkedRevenue=0,unlinkedDraws=0;
 for(const x of s){
  const bid=x.bundle_id||(x.bundle_code?keyMap.get(`${x.owner_id}::${x.bundle_code}`):null);
  if(bid&&stats.has(bid)){const st=stats.get(bid);st.revenue+=Number(x.revenue||0);st.draws+=Number(x.draws||0);st.salesCount++;if(x.sale_date&&(!st.firstSale||x.sale_date<st.firstSale))st.firstSale=x.sale_date;}
  else{unlinkedRevenue+=Number(x.revenue||0);unlinkedDraws+=Number(x.draws||0);}
 }
 return {stats,unlinkedRevenue,unlinkedDraws};
}
function derivedBundle(b,stats){const st=stats.get(b.id)||{revenue:0,draws:0,salesCount:0,firstSale:null};const hasSales=st.salesCount>0;return {...b,_revenue:st.revenue,_draws:st.draws,_salesCount:st.salesCount,_firstSale:st.firstSale,_profit:hasSales?st.revenue-Number(b.cost||0):0,_recognizedCost:hasSales?Number(b.cost||0):0};}
function renderOverview(){const {b,s}=ownerFiltered();document.getElementById('pageTitle').textContent=selectedOwner==='ALL'?'全部老闆':ownerName(selectedOwner);document.getElementById('pageSubtitle').textContent='雲端資料庫｜毛利由實際銷售紀錄計算';const calc=salesStatsForBundles(b,s),db=b.map(x=>derivedBundle(x,calc.stats));const revenue=s.reduce((a,x)=>a+Number(x.revenue||0),0);const cost=b.reduce((a,x)=>a+Number(x.cost||0),0);const profit=db.reduce((a,x)=>a+x._profit,0)+calc.unlinkedRevenue;const draws=s.reduce((a,x)=>a+Number(x.draws||0),0);const active=b.filter(x=>x.status==='進行中').length;
const months={};for(const x of s){const m=(x.sale_date||'').slice(0,7)||'未知';months[m]=(months[m]||0)+Number(x.revenue||0)}const mkeys=Object.keys(months).sort().slice(-6);const max=Math.max(...mkeys.map(k=>months[k]),1);
const staff={};for(const x of s){const k=x.entered_by||'未填寫';staff[k]=(staff[k]||0)+Number(x.revenue||0)}const st=Object.entries(staff).sort((a,b)=>b[1]-a[1]).slice(0,8);
document.getElementById('content').innerHTML=`<div class="grid"><div class="kpi"><div class="label">累計營收</div><div class="value">${money(revenue)}</div></div><div class="kpi"><div class="label">套組成本</div><div class="value">${money(cost)}</div></div><div class="kpi"><div class="label">毛利</div><div class="value">${money(profit)}</div></div><div class="kpi"><div class="label">已售抽數</div><div class="value">${draws}</div></div></div>
<div class="charts"><div class="section"><div class="section-head"><h2>月營收</h2><span class="muted">${active} 個進行中套組</span></div>${mkeys.length?mkeys.map(k=>`<div style="margin:12px 0"><div class="split" style="justify-content:space-between;font-size:13px"><span>${k}</span><b>${money(months[k])}</b></div><div class="bar" style="margin-top:6px"><span style="width:${months[k]/max*100}%"></span></div></div>`).join(''):'<div class="empty">尚無資料</div>'}</div>
<div class="section"><div class="section-head"><h2>填表人營收</h2></div>${st.length?st.map(([k,v])=>`<div style="margin:12px 0"><div class="split" style="justify-content:space-between;font-size:13px"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar" style="margin-top:6px"><span style="width:${v/Math.max(...st.map(x=>x[1]),1)*100}%"></span></div></div>`).join(''):'<div class="empty">尚無資料</div>'}</div></div>
<div class="section"><div class="section-head"><h2>套組</h2><button class="btn" onclick="openBundleForm()">＋ 新增</button></div><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>編號</th><th>品名</th><th>成本</th><th>收入</th><th>毛利</th><th>刮數</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.slice(0,30).map(x=>`<tr><td>${x.bundle_date||''}</td><td><b>${esc(x.code)}</b></td><td>${esc(x.product_name)}</td><td>${money(x.cost)}</td><td>${money(x._revenue)}</td><td>${money(x._profit)}</td><td>${x._draws} ${esc(x.draw_target||'')}</td><td>${statusPill(x.status)}</td><td><button class="btn" onclick="openBundleForm('${x.id}')">編輯</button></td></tr>`).join('')}</tbody></table></div>${b.length>30?'<div class="muted" style="padding-top:10px">僅顯示最新 30 筆，完整資料可在下方銷售與套組管理中查詢。</div>':''}</div>
<div class="section"><div class="section-head"><h2>最近銷售</h2><button class="btn" onclick="openSaleForm()">＋ 新增</button></div><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>編號</th><th>品名</th><th>抽數</th><th>單價</th><th>折價</th><th>收入</th><th>收款</th><th>填表人</th><th>備註</th></tr></thead><tbody>${s.slice(0,50).map(x=>`<tr><td>${x.sale_date||''}</td><td>${esc(x.bundle_code||'')}</td><td>${esc(x.product_name)}</td><td>${x.draws}</td><td>${money(x.unit_price)}</td><td>${money(x.discount)}</td><td><b>${money(x.revenue)}</b></td><td>${esc(x.payment_method||'')}</td><td>${esc(x.entered_by||'')}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderBundles(){const {b,s}=ownerFiltered();const calc=salesStatsForBundles(b,s),db=b.map(x=>derivedBundle(x,calc.stats));document.getElementById('pageTitle').textContent=(selectedOwner==='ALL'?'全部老闆':ownerName(selectedOwner))+'｜套組管理';document.getElementById('pageSubtitle').textContent='套組基本資料獨立管理｜銷售額、已售抽數與毛利由銷售紀錄自動計算';const totalCost=b.reduce((a,x)=>a+Number(x.cost||0),0),totalRevenue=s.reduce((a,x)=>a+Number(x.revenue||0),0),totalProfit=db.reduce((a,x)=>a+x._profit,0)+calc.unlinkedRevenue,active=b.filter(x=>x.status==='進行中').length;document.getElementById('content').innerHTML=`<div class="grid"><div class="kpi"><div class="label">套組數</div><div class="value">${b.length}</div></div><div class="kpi"><div class="label">進行中</div><div class="value">${active}</div></div><div class="kpi"><div class="label">套組成本</div><div class="value">${money(totalCost)}</div></div><div class="kpi"><div class="label">套組毛利</div><div class="value">${money(totalProfit)}</div></div></div><div class="section"><div class="section-head"><h2>套組清單</h2><button class="btn primary" onclick="openBundleForm()">＋ 新增套組</button></div><div class="table-wrap"><table class="table"><thead><tr><th>老闆</th><th>日期</th><th>編號</th><th>品名</th><th>成本</th><th>銷售額</th><th>毛利</th><th>刮數</th><th>價格</th><th>狀態</th><th>操作</th></tr></thead><tbody>${db.map(x=>`<tr><td>${esc(ownerName(x.owner_id))}</td><td>${x.bundle_date||''}</td><td><b>${esc(x.code)}</b></td><td>${esc(x.product_name)}</td><td>${money(x.cost)}</td><td>${money(x._revenue)}</td><td><b>${money(x._profit)}</b></td><td>${x._draws||0} ${esc(x.draw_target||'')}</td><td>${esc(x.price||'')}</td><td>${statusPill(x.status)}</td><td><button class="btn" onclick="openBundleForm('${x.id}')">編輯</button></td></tr>`).join('')}</tbody></table></div>${b.length?'':'<div class="empty">目前沒有套組資料</div>'}</div>`}
function renderSalesAnalytics(){const {b,s}=ownerFiltered();const calc=salesStatsForBundles(b,s),db=b.map(x=>derivedBundle(x,calc.stats));document.getElementById('pageTitle').textContent=(selectedOwner==='ALL'?'全部老闆':ownerName(selectedOwner))+'｜銷售分析';document.getElementById('pageSubtitle').textContent='以銷售紀錄為基準｜尚未產生銷售的套組不計入毛利與銷售成本';const revenue=s.reduce((a,x)=>a+Number(x.revenue||0),0),cost=db.reduce((a,x)=>a+x._recognizedCost,0),profit=db.reduce((a,x)=>a+x._profit,0)+calc.unlinkedRevenue,draws=s.reduce((a,x)=>a+Number(x.draws||0),0);const months={};for(const x of s){const k=(x.sale_date||'未填').slice(0,7);months[k]=(months[k]||0)+Number(x.revenue||0)}const costByMonth={};for(const x of db){if(!x._salesCount)continue;const k=(x._firstSale||x.bundle_date||'未填').slice(0,7);costByMonth[k]=(costByMonth[k]||0)+Number(x.cost||0)}const labels=[...new Set([...Object.keys(months),...Object.keys(costByMonth)])].sort();const byBundle=db.filter(x=>x._salesCount>0).map(x=>({name:`${x.code} ${x.product_name}`,cost:Number(x.cost||0),revenue:x._revenue,profit:x._profit})).sort((a,z)=>z.revenue-a.revenue).slice(0,12);document.getElementById('content').innerHTML=`<div class="grid"><div class="kpi"><div class="label">總銷售額</div><div class="value">${money(revenue)}</div></div><div class="kpi"><div class="label">已銷售套組成本</div><div class="value">${money(cost)}</div></div><div class="kpi"><div class="label">銷售毛利</div><div class="value">${money(profit)}</div></div><div class="kpi"><div class="label">已售抽數</div><div class="value">${draws}</div></div></div><div class="charts"><div class="section"><div class="section-head"><h2>成本 vs 銷售額</h2><span class="muted">成本於該套組首次銷售月份認列</span></div><div class="chart-box"><canvas id="monthlyCostRevenue"></canvas></div></div><div class="section"><div class="section-head"><h2>套組成本／銷售額比較</h2><span class="muted">僅顯示已有銷售的套組</span></div><div class="chart-box"><canvas id="bundleCostRevenue"></canvas></div></div></div><div class="section"><div class="section-head"><h2>銷售紀錄</h2><button class="btn primary" onclick="openSaleForm()">＋ 新增銷售</button></div><div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>老闆</th><th>編號</th><th>品名</th><th>抽數</th><th>單價</th><th>折價</th><th>銷售額</th><th>收款</th><th>填表人</th><th>備註</th></tr></thead><tbody>${s.map(x=>`<tr><td>${x.sale_date||''}</td><td>${esc(ownerName(x.owner_id))}</td><td>${esc(x.bundle_code||'')}</td><td>${esc(x.product_name)}</td><td>${x.draws||0}</td><td>${money(x.unit_price)}</td><td>${money(x.discount)}</td><td><b>${money(x.revenue)}</b></td><td>${esc(x.payment_method||'')}</td><td>${esc(x.entered_by||'')}</td><td>${esc(x.note||'')}</td></tr>`).join('')}</tbody></table></div>${s.length?'':'<div class="empty">目前沒有銷售紀錄；成本與毛利皆顯示 0。</div>'}</div>`;setTimeout(()=>{const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${money(ctx.raw)}`}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>new Intl.NumberFormat('zh-TW',{notation:'compact'}).format(v)}}}};const c1=document.getElementById('monthlyCostRevenue');if(c1)chartInstances.push(new Chart(c1,{type:'bar',data:{labels,datasets:[{label:'成本',data:labels.map(k=>costByMonth[k]||0)},{label:'銷售額',data:labels.map(k=>months[k]||0)}]},options:common}));const c2=document.getElementById('bundleCostRevenue');if(c2)chartInstances.push(new Chart(c2,{type:'bar',data:{labels:byBundle.map(x=>x.name),datasets:[{label:'成本',data:byBundle.map(x=>x.cost)},{label:'銷售額',data:byBundle.map(x=>x.revenue)}]},options:{...common,indexAxis:'y'}}))},0)}

function statusPill(v){const c=v==='結束'||v==='完成'?'ok':v==='進行中'?'warn':'bad';return `<span class="pill ${c}">${esc(v||'')}</span>`}
function ownerOptions(sel,includeAll=false){return (includeAll?`<option value="ALL">全部老闆</option>`:'')+owners.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('')}
function openBundleForm(id){editingId=id||null;const x=id?bundles.find(b=>b.id===id):null;document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>${x?'編輯套組':'新增套組'}</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveBundle(event)"><div class="form-grid"><div class="field"><label>老闆</label><select id="bf_owner" required>${ownerOptions(x?.owner_id||selectedOwner==='ALL'?(owners[0]?.id||''):selectedOwner)}</select></div><div class="field"><label>日期</label><input id="bf_date" type="date" value="${x?.bundle_date||new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>套組編號</label><input id="bf_code" value="${esc(x?.code||'')}" required></div><div class="field"><label>品名</label><input id="bf_name" value="${esc(x?.product_name||'')}" required></div><div class="field"><label>成本</label><input id="bf_cost" type="number" step="1" value="${x?.cost||0}"></div><div class="field"><label>價格</label><input id="bf_price" value="${esc(x?.price||'')}"></div><div class="field"><label>刮數目標</label><input id="bf_target" value="${esc(x?.draw_target||'')}"></div><div class="field"><label>狀態</label><select id="bf_status"><option ${x?.status==='進行中'?'selected':''}>進行中</option><option ${x?.status==='結束'?'selected':''}>結束</option><option ${x?.status==='免單結束'?'selected':''}>免單結束</option></select></div><div class="field"><label>結束日期</label><input id="bf_end" type="date" value="${x?.end_date||''}"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">儲存</button></div></form></div>`;document.getElementById('modal').style.display='flex'}
async function saveBundle(e){e.preventDefault();const payload={owner_id:bf_owner.value,bundle_date:bf_date.value,code:bf_code.value.trim(),product_name:bf_name.value.trim(),cost:Number(bf_cost.value||0),draw_target:bf_target.value.trim()||null,status:bf_status.value,price:bf_price.value.trim()||null,end_date:bf_end.value||null};let q;if(editingId)q=await sb.from('bundles').update(payload).eq('id',editingId);else q=await sb.from('bundles').insert(payload);if(q.error)return toast(q.error.message);toast('套組已儲存；銷售額、抽數與毛利由銷售紀錄自動計算');closeModal();await loadAll()}
function openSaleForm(){editingId=null;const defaultOwner=selectedOwner==='ALL'?(owners[0]?.id||''):selectedOwner;document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>新增銷售紀錄</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveSale(event)"><div class="form-grid"><div class="field"><label>老闆</label><select id="sf_owner" required onchange="refreshBundleOptions()">${ownerOptions(defaultOwner)}</select></div><div class="field"><label>日期</label><input id="sf_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field full"><label>套組</label><select id="sf_bundle" onchange="fillSaleProduct()">${bundleOptions(defaultOwner)}</select></div><div class="field"><label>套組編號</label><input id="sf_code" required></div><div class="field"><label>品名</label><input id="sf_name" required></div><div class="field"><label>售出抽數</label><input id="sf_draws" type="number" min="0" step="1" required></div><div class="field"><label>單價</label><input id="sf_price" type="number" step="1" required></div><div class="field"><label>折價金額（可輸入負數）</label><input id="sf_discount" type="number" step="1" value="0"></div><div class="field"><label>收款方式</label><select id="sf_pay"><option value="">未填</option><option>現金</option><option>轉帳</option><option>刷卡</option><option>其他</option></select></div><div class="field"><label>填表人</label><input id="sf_staff" placeholder="例如：喬"></div><div class="field full"><label>備註</label><textarea id="sf_note"></textarea></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">儲存銷售</button></div></form></div>`;document.getElementById('modal').style.display='flex';fillSaleProduct()}
function bundleOptions(owner){const bs=bundles.filter(b=>!owner||b.owner_id===owner);return `<option value="">選擇套組</option>`+bs.map(b=>`<option value="${b.id}" data-code="${esc(b.code)}" data-name="${esc(b.product_name)}" data-price="${esc(b.price||'')}">${esc(b.code)}｜${esc(b.product_name)}</option>`).join('')}
function refreshBundleOptions(){sf_bundle.innerHTML=bundleOptions(sf_owner.value);fillSaleProduct()}
function fillSaleProduct(){const o=sf_bundle.options[sf_bundle.selectedIndex];if(!o||!o.value)return;sf_code.value=o.dataset.code||'';sf_name.value=o.dataset.name||'';const p=o.dataset.price||'';const m=p.match(/\d+(?:\.\d+)?/);if(m)sf_price.value=m[0]}
async function saveSale(e){e.preventDefault();let bid=sf_bundle.value||null;let code=sf_code.value.trim();let name=sf_name.value.trim();const payload={owner_id:sf_owner.value,bundle_id:bid,sale_date:sf_date.value,bundle_code:code,product_name:name,draws:Number(sf_draws.value||0),unit_price:Number(sf_price.value||0),discount:Number(sf_discount.value||0),payment_method:sf_pay.value||null,entered_by:sf_staff.value.trim()||null,note:sf_note.value.trim()||null};const q=await sb.from('sales').insert(payload);if(q.error)return toast(q.error.message);toast('銷售紀錄已新增');closeModal();await loadAll()}

function openImportForm(){
 document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>Excel 匯入雲端資料庫</h3><button class="btn" onclick="closeModal()">關閉</button></div><p class="muted">可直接選擇「套組＋銷售紀錄」Excel。系統會依你選擇的老闆匯入，套組編號會自動去重；銷售資料會以匯入指紋避免重複。</p><div class="form-grid"><div class="field"><label>資料所屬老闆</label><select id="imp_owner" required>${ownerOptions(selectedOwner==='ALL'?(owners[0]?.id||''):selectedOwner)}</select></div><div class="field"><label>Excel 檔案</label><input id="imp_file" type="file" accept=".xlsx,.xls" required></div><div class="field full"><label>匯入規則</label><div class="muted" style="line-height:1.7">① 套組：使用「編號」作為老闆內唯一鍵。<br>② 銷售：自動用日期／編號／抽數／單價／折價／收款／填表人／備註產生匯入指紋。<br>③ Excel 裡的 #NAME? 品名會依編號回填套組品名。<br>④ Excel 內舊的收入／毛利不直接採用；系統只依實際銷售紀錄計算收入、抽數與毛利。</div></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary" onclick="importExcel()">開始匯入</button></div><div id="imp_status" class="muted" style="margin-top:12px"></div></div>`;
 document.getElementById('modal').style.display='flex';
}
function xDate(v){if(v==null||v==='')return null;if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10)}if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10)}
function xNum(v){if(v==null||v===''||v==='#NAME?')return null;const n=Number(String(v).replace(/,/g,''));return Number.isFinite(n)?n:null}
function fingerprint(a){let str=a.map(v=>v==null?'':String(v).trim()).join('\u001f');let h=0;for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0}return 'excel_'+(h>>>0).toString(16)+'_'+btoa(unescape(encodeURIComponent(str))).slice(0,80).replace(/[^a-zA-Z0-9_-]/g,'');}
async function importExcel(){const ownerId=document.getElementById('imp_owner').value;const file=document.getElementById('imp_file').files[0];const status=document.getElementById('imp_status');if(!file)return toast('請選擇 Excel');status.textContent='讀取 Excel 中…';try{const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array',cellDates:true});const bs=XLSX.utils.sheet_to_json(wb.Sheets['套組'],{header:1,defval:null});const ss=XLSX.utils.sheet_to_json(wb.Sheets['銷售紀錄'],{header:1,defval:null});if(!bs.length||!ss.length)throw new Error('找不到「套組」或「銷售紀錄」工作表');const bmap=new Map();const bRows=[];for(const r of bs.slice(1)){const code=r[1],name=r[2];if(!code||code==='#NAME?'||!name||name==='#NAME?')continue;const rec={owner_id:ownerId,bundle_date:xDate(r[0]),code:String(code).trim(),product_name:String(name).trim(),cost:xNum(r[3])||0,draw_target:r[6]==null||r[6]===''?null:String(r[6]),status:r[7]==null||r[7]===''?'進行中':String(r[7]),price:r[9]==null||r[9]===''?null:String(r[9]),end_date:xDate(r[10])};bmap.set(rec.code,rec);bRows.push(rec)}status.textContent=`準備匯入 ${bRows.length} 個套組…`;if(bRows.length){const qb=await sb.from('bundles').upsert(bRows,{onConflict:'owner_id,code'});if(qb.error)throw qb.error}const {data:existingBundles,error:be}=await sb.from('bundles').select('id,code,product_name').eq('owner_id',ownerId);if(be)throw be;const idMap=new Map((existingBundles||[]).map(x=>[x.code,x]));const sRows=[];for(const r of ss.slice(1)){const dt=xDate(r[0]);const code=r[1]==null||r[1]===''||r[1]==='#NAME?'?null:String(r[1]).trim();let name=(r[2]==null||r[2]===''||r[2]==='#NAME?')?null:String(r[2]).trim();if(!name&&code&&idMap.has(code))name=idMap.get(code).product_name;if(!dt&&!code&&xNum(r[3])==null&&xNum(r[6])==null)continue;name=name||'未指定品名';const draws=Math.trunc(xNum(r[3])||0),unit=xNum(r[4])||0,discount=xNum(r[5])||0;const revenue=xNum(r[6]);const base=[ownerId,dt,code,name,draws,unit,discount,r[7],r[8],r[9]];sRows.push({owner_id:ownerId,bundle_id:code&&idMap.has(code)?idMap.get(code).id:null,sale_date:dt,bundle_code:code,product_name:name,draws,unit_price:unit,discount,payment_method:r[7]==null||r[7]===''?null:String(r[7]),entered_by:r[8]==null||r[8]===''?null:String(r[8]),note:r[9]==null||r[9]===''?null:String(r[9]),import_source_key:fingerprint(base)})}status.textContent=`準備匯入 ${sRows.length} 筆銷售…`;for(let i=0;i<sRows.length;i+=100){const chunk=sRows.slice(i,i+100);const qs=await sb.from('sales').upsert(chunk,{onConflict:'import_source_key',ignoreDuplicates:true});if(qs.error)throw qs.error;status.textContent=`銷售匯入 ${Math.min(i+100,sRows.length)}/${sRows.length}…`}status.textContent='完成，重新整理資料…';toast(`匯入完成：${bRows.length} 個套組、${sRows.length} 筆銷售`);closeModal();await loadAll()}catch(err){status.textContent='匯入失敗：'+(err.message||err);toast(err.message||'Excel 匯入失敗')}}

function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modal').innerHTML=''}
function renderOwnerManager(){if(!isEngineer()){currentView='overview';return renderOverview()}document.getElementById('pageTitle').textContent='老闆管理';document.getElementById('pageSubtitle').textContent='管理老闆帳本狀態｜套組與銷售筆數即時統計';document.getElementById('content').innerHTML=`<div class="section"><div class="section-head"><h2>老闆管理</h2><button class="btn primary" onclick="addOwner()">＋ 新增老闆</button></div><div class="table-wrap"><table class="table"><thead><tr><th>名稱</th><th>狀態</th><th>套組</th><th>銷售</th><th>操作</th></tr></thead><tbody>${owners.map(o=>`<tr><td><b>${esc(o.name)}</b></td><td>${statusPill(o.active?'啟用':'停用')}</td><td>${bundles.filter(b=>b.owner_id===o.id).length}</td><td>${sales.filter(s=>s.owner_id===o.id).length}</td><td><button class="btn" onclick="toggleOwner('${o.id}',${!o.active})">${o.active?'停用':'啟用'}</button></td></tr>`).join('')}</tbody></table></div></div>`} async function showOwnerManager(){setView('owners')}
async function addOwner(){const name=prompt('請輸入老闆名稱');if(!name)return;const max=Math.max(0,...owners.map(x=>x.display_order||0));const q=await sb.from('owners').insert({name:name.trim(),display_order:max+1,active:true});if(q.error)return toast(q.error.message);toast('老闆已新增');await loadAll()}
async function toggleOwner(id,active){const q=await sb.from('owners').update({active}).eq('id',id);if(q.error)return toast(q.error.message);await loadAll()}
window.addEventListener('load',init);
</script>
