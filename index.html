tify-content:center;padding:18px;z-index:50}.modal{background:#fff;width:min(740px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px;box-shadow:0 28px 70px rgba(15,38,64,.28)}.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 30% 20%,#dbeafe 0,transparent 35%),linear-gradient(135deg,#edf4fb,#f9fbfe)}.login-card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid #dfe9f3;box-shadow:0 25px 60px rgba(31,58,88,.13);border-radius:22px;padding:30px}.toast{position:fixed;right:18px;bottom:18px;background:#10253f;color:white;padding:12px 15px;border-radius:11px;display:none;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.18)}.muted{color:var(--muted)}.split{display:flex;gap:8px;align-items:center}.payment-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.checkout-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:13px;border:1px solid #dfe8f1;border-radius:14px;background:#f7faff}.checkout-summary b{display:block;font-size:20px;margin-top:4px}.report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.report-chip{padding:13px 15px;border:1px solid #e1e8f0;border-radius:14px;background:#f9fbfe}.report-chip span{font-size:11px;color:var(--muted);font-weight:700}.report-chip b{display:block;font-size:20px;margin-top:4px}.hide{display:none!important}@media(max-width:1050px){.side{width:218px;padding:16px 12px}.owner-title{padding-top:10px}.owner-tab,.nav-btn{padding:9px 10px}.brand{top:-16px;padding-bottom:14px}.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.side{position:static;width:auto;height:auto;max-height:none;overflow:visible;padding:12px}.brand{position:static;background:transparent}.owner-tabs{flex-direction:row;overflow:auto}.owner-tab{white-space:nowrap}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.report-summary{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}

.settle-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.settle-card{border:1px solid #dbe5f1;border-radius:16px;background:#fff;padding:16px;box-shadow:0 6px 20px rgba(15,23,42,.05)}.settle-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.settle-card-head div{display:flex;flex-direction:column;gap:3px}.settle-card-head span{font-size:12px;color:#64748b}.settle-numbers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.settle-numbers div{display:flex;flex-direction:column;gap:2px;padding:9px 10px;background:#f8fafc;border-radius:10px}.settle-numbers span{font-size:11px;color:#64748b}.settle-numbers b{font-size:15px}.settle-numbers .settle-due{grid-column:1/-1;background:#fff7ed;border:1px solid #fed7aa}.settle-numbers .settle-due b{font-size:20px;color:#c2410c}.settle-action{width:100%;justify-content:center}
.search-select{position:relative}.search-select-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;max-height:320px;overflow:auto;background:#fff;border:1px solid #dbe5ef;border-radius:12px;box-shadow:0 18px 45px rgba(15,38,64,.18);padding:6px}.search-select-menu.show{display:block}.search-select-item{width:100%;border:0;background:#fff;text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:3px 9px;align-items:center;color:var(--text)}.search-select-item:hover{background:#f1f6fb}.search-select-item b{font-size:13px}.search-select-item span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search-select-item small{grid-column:1/-1;color:var(--muted);font-size:11px}.search-select-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}

<div id="root"></div>

<script>
const CONFIG={SUPABASE_URL:'https://juspbhysjkqwzfccrnhb.supabase.co',SUPABASE_PUBLISHABLE_KEY:'sb_publishable_SlN9cUzDYke3Mh2cmaBJxA_wnX5Pv7R'};
let sb=null,session=null,owners=[],bundles=[],sales=[],monthlyReports=[],ownerSettlements=[],ownerExpenses=[],selectedOwner='ALL',editingId=null,currentView='overview',chartInstances=[],bundleStatusFilter='ALL';
const LOGIN_EMAILS={boss:'boss@internal.app',jen:'jen@internal.app'};
function appRole(){return session?.user?.app_metadata?.app_role||''}
function username(){return session?.user?.user_metadata?.username||Object.entries(LOGIN_EMAILS).find(([,e])=>e===session?.user?.email)?.[0]||session?.user?.email||''}
function isEngineer(){return appRole()==='jen'}
function engineerNote(html){return isEngineer()?html:''}
function requireEngineer(){if(!isEngineer()){toast('此功能僅限 jen 工程師帳號');return false}return true}
const money=n=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function configured(){return CONFIG.SUPABASE_URL.startsWith('http')&&!CONFIG.SUPABASE_URL.includes('YOUR_')&&CONFIG.SUPABASE_PUBLISHABLE_KEY&&!CONFIG.SUPABASE_PUBLISHABLE_KEY.includes('YOUR_')}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function isJwtError(err){const m=String(err?.message||err||'').toLowerCase();return m.includes('jwt')||m.includes('token')&&(['expired','invalid','issued','signature','not yet valid'].some(x=>m.includes(x)))}
let refreshingSession=null;
async function refreshAuthSession(){
 if(refreshingSession)return refreshingSession;
 refreshingSession=(async()=>{
   try{
     const {data,error}=await sb.auth.refreshSession();
     if(error)throw error;
     session=data.session||null;
     return !!session;
   }catch(err){
     if(isEngineer())toast('JWT 更新失敗：'+(err?.message||err));
     return false;
   }finally{refreshingSession=null}
 })();
 return refreshingSession;
}
async function authRetry(fn,{quiet=false}={}){
 let result=await fn();
 if(result?.error&&isJwtError(result.error)){
   if(!quiet)toast(isEngineer()?'JWT 已失效，正在重新取得登入憑證…':'登入狀態更新中，正在重新連線…');
   const ok=await refreshAuthSession();
   if(ok)result=await fn();
   else{
     session=null;
     if(!quiet)toast('登入狀態已過期，請重新登入');
     setTimeout(()=>showLogin(),500);
   }
 }
 return result;
}

function shell(){const roleLabel=isEngineer()?'最高權限｜工程師':'營運管理權限';const managementMode=currentView==='owners';const topActions=managementMode?`<button class="btn" onclick="loadAll()">↻ 重新整理</button>`:`<button class="btn" onclick="loadAll()">↻ 重新整理</button><button class="btn" onclick="openImportForm()">⇧ Excel 匯入</button><button class="btn" onclick="openBundleForm()">＋ 新增套組</button><button class="btn primary" onclick="openSaleForm()">＋ 新增銷售</button>`;document.getElementById('root').innerHTML=`<div class="app"><aside class="side"><div class="brand">失控寄抽管理系統</div><div class="owner-title">營運對象</div><div id="owners" class="owner-tabs"></div><div class="owner-title">營運功能</div><div class="owner-tabs"><button class="nav-btn ${currentView==='bundles'?'active':''}" onclick="setView('bundles')">📦 套組管理</button><button class="nav-btn ${currentView==='sales'?'active':''}" onclick="setView('sales')">📈 銷售分析</button><button class="nav-btn ${currentView==='overview'?'active':''}" onclick="setView('overview')">📊 營運總覽</button><button class="nav-btn ${currentView==='reports'?'active':''}" onclick="setView('reports')">🧾 月結報表</button></div><div class="owner-title" style="margin-top:10px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">總管理區</div><div class="owner-tabs"><button class="nav-btn ${currentView==='owners'?'active':''}" onclick="setView('owners')">👥 老闆管理</button></div><div style="margin-top:18px;padding:10px;color:#9ca3af;font-size:12px"><b style="color:white">${esc(username())}</b><br>${roleLabel}<br><button class="btn" style="margin-top:8px;width:100%" onclick="logout()">登出</button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">全部老闆</h1><div id="pageSubtitle" class="subtitle">雲端資料庫｜套組、銷售、營收即時同步</div></div><div class="actions">${topActions}</div></div><div id="content"></div></main></div>`;renderOwners();renderContent();}
function setView(view){currentView=view;shell()}
function clearCharts(){for(const c of chartInstances){try{c.destroy()}catch(e){}}chartInstances=[]}
async function init(){if(!configured()){document.getElementById('root').innerHTML=`<div class="login"><div class="login-card"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">這個版本已完成 Supabase 對接。現在還缺你的 Supabase URL 與 Publishable Key；請編輯本檔最上方 CONFIG，或依附檔 README 完成設定。</p><p style="font-size:13px">資料表、RLS 權限與 Excel 匯入 SQL 都已準備好。</p><button class="btn primary" onclick="location.reload()">設定完成後重新載入</button></div></div>`;return}
sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); sb.auth.onAuthStateChange((event,newSession)=>{session=newSession||null;if(event==='SIGNED_OUT'&&!session)showLogin()}); const r=await sb.auth.getSession();session=r.data.session;if(!session){showLogin();return} await loadAll();}
function showLogin(){document.getElementById('root').innerHTML=`<div class="login"><form class="login-card" onsubmit="login(event)"><h1 style="margin-top:0">失控寄抽管理系統</h1><p class="muted">請使用系統帳號與密碼登入。</p><div class="field" style="margin-bottom:10px"><label>帳號</label><input id="luser" autocomplete="username" placeholder="輸入帳號" required></div><div class="field"><label>密碼</label><input id="lpass" type="password" autocomplete="current-password" placeholder="輸入密碼" required></div><div class="modal-actions"><button class="btn primary">登入</button></div></form></div>`}
async function login(e){e.preventDefault();const u=luser.value.trim().toLowerCase();const email=LOGIN_EMAILS[u];if(!email)return toast('帳號或密碼錯誤');const {data,error}=await sb.auth.signInWithPassword({email,password:lpass.value});if(error)return toast('帳號或密碼錯誤');session=data.session;if(!['boss','jen'].includes(appRole())){await sb.auth.signOut();session=null;return toast('此帳號沒有系統權限')}await loadAll()}
async function logout(){await sb.auth.signOut();session=null;showLogin()}
async function loadAll(){
 const content=document.getElementById('content');
 if(content&&!content.innerHTML.trim())content.innerHTML='<div class="section"><div class="empty">正在載入營運資料…</div></div>';
 const fetchAll=()=>Promise.all([
   authRetry(()=>sb.from('owners').select('*').order('display_order').order('name'),{quiet:true}),
   authRetry(()=>sb.from('bundles').select('*').order('bundle_date',{ascending:false}),{quiet:true}),
   authRetry(()=>sb.from('sales').select('*').order('sale_date',{ascending:false}),{quiet:true}),
   authRetry(()=>sb.from('monthly_reports').select('*').order('report_month',{ascending:false}),{quiet:true}),
   authRetry(()=>sb.from('monthly_owner_settlements').select('*').order('settled_at',{ascending:false}),{quiet:true}),
   authRetry(()=>sb.from('monthly_owner_expenses').select('*').order('created_at',{ascending:false}),{quiet:true})
 ]);
 let [o,b,s,r,c,x]=await fetchAll();
 let failed=[o,b,s,r,c,x].find(v=>v?.error);
 if(failed&&isJwtError(failed.error)){
   toast(isEngineer()?'JWT 驗證失效，正在重新連線…':'登入狀態更新中，正在重新連線…');
   const ok=await refreshAuthSession();
   if(ok){[o,b,s,r,c,x]=await fetchAll();failed=[o,b,s,r,c,x].find(v=>v?.error)}
 }
 if(failed){
   const msg=isEngineer()?failed.error.message:(isJwtError(failed.error)?'登入狀態已過期，請重新登入':'資料暫時無法載入，請稍後再試');
   toast(msg);
   if(isJwtError(failed.error)){session=null;setTimeout(()=>showLogin(),500)}
   else if(content)content.innerHTML='<div class="section"><div class="empty">資料載入失敗 <button class="btn" onclick="loadAll()">重新連線</button></div></div>';
   return;
 }
 owners=(o.data||[]).sort((a,b)=>compareCodes(a.owner_code||'ZZZ',b.owner_code||'ZZZ'));
 bundles=(b.data||[]).sort((a,b)=>{const dc=String(b.bundle_date||'').localeCompare(String(a.bundle_date||''));return dc||compareBundleCodesDesc(a.code,b.code)});
 sales=s.data||[];monthlyReports=r.data||[];ownerSettlements=c.data||[];ownerExpenses=x.data||[];shell()
}
function ownerName(id){return owners.find(o=>o.id===id)?.name||'未知老闆'}
function compareCodes(a,b){return String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'});}
function compareBundleCodesDesc(a,b){return String(b||'').localeCompare(String(a||''),'en',{numeric:true,sensitivity:'base'});}
function sortSalesByEnteredTime(a,b){const d=String(b.sale_date||'').localeCompare(String(a.sale_date||''));if(d)return d;return String(b.created_at||'').localeCompare(String(a.created_at||''));}
function fmtDate(d){if(!d)return '未設定';const x=new Date(d+'T00:00:00');if(Number.isNaN(x.getTime()))return d;return x.toLocaleDateString('zh-TW')}
function daysUntil(d){if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d+'T00:00:00');return Math.ceil((b-a)/86400000)}
function ownerExpired(o){if(!o?.draw_expiry_date)return false;return localYMD()>=String(o.draw_expiry_date)}
function ownerOperational(o){return !!o?.active&&!ownerExpired(o)}

function salesStatsForBundles(b,s){
 const stats=new Map();
 const keyMap=new Map(b.map(x=>[`${x.owner_id}::${x.code}`,x.id]));
 for(const x of b)stats.set(x.id,{revenue:0,draws:0,salesCount:0,firstSale:null});
 let unlinkedRevenue=0,unlinkedDraws=0;
 for(const x of s){
  const bid=x.bundle_id||(x.bundle_code?keyMap.get(`${x.owner_id}::${x.bundle_code}`):null);
  if(bid&&stats.has(bid)){const st=stats.get(bid);st.revenue+=Number(x.revenue||0);st.draws+=Number(x.draws||0);st.salesCount++;if(x.sale_date&&(!st.firstSale||x.sale_date<st.firstSale))st.firstSale=x.sale_date;}
  else{unlinkedRevenue+=Number(x.revenue||0);unlinkedDraws+=Number(x.draws||0);}
 }
 return {stats,unlinkedRevenue,unlinkedDraws};
}
function derivedBundle(b,stats){const st=stats.get(b.id)||{revenue:0,draws:0,salesCount:0,firstSale:null};const hasSales=st.salesCount>0;return {...b,_revenue:st.revenue,_draws:st.draws,_salesCount:st.salesCount,_firstSale:st.firstSale,_profit:hasSales?st.revenue-Number(b.cost||0):0,_recognizedCost:hasSales?Number(b.cost||0):0};}

function parseDrawProgress(v){const t=String(v??'').trim();if(!t)return {done:0,total:null};if(t.includes('/')){const [a,b]=t.split('/',2);const da=Number((a.match(/\d+/)||['0'])[0]);const tb=(b.match(/\d+/)||[])[0];return {done:Number.isFinite(da)?da:0,total:tb?Number(tb):null};}const m=t.match(/\d+/);return {done:0,total:m?Number(m[0]):null};}
function totalDrawTarget(b){const n=Number(b.total_draw_target);if(Number.isFinite(n)&&n>0)return n;const m=String(b.draw_target||'').match(/\d+/);return m?Number(m[0]):null}
function drawProgress(b){const total=totalDrawTarget(b);return `${Number(b._draws||0)}/${total??'-'}`}
function saleBalanceDue(x){
 const revenue=Number(x?.revenue||0);
 const received=Number(x?.amount_received||0);
 const change=Math.max(Number(x?.change_due||0),0);
 return Math.max(revenue-received+change,0);
}
function balanceDueHtml(x){
 const due=saleBalanceDue(x);
 return due!==0?`<b style="color:#dc2626">${money(due)}</b>`:`${money(0)}`;
}

function pad2(n){return String(n).padStart(2,'0')}
function localYMD(d=new Date()){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}

   const draws=Math.trunc(drawsRaw||0),unit=unitRaw||0,discount=discountRaw==null?0:-Math.abs(discountRaw);
   const base=[ownerId,dt,code,name,draws,unit,discount,payment,staff,note];
   excelSales.push({owner_id:ownerId,sale_date:dt,bundle_code:code,product_name:name,draws,unit_price:unit,discount,payment_method:payment,entered_by:staff,note,import_source_key:fingerprint(base)});
  }

  // Excel 的已刮 = 歷史基準 + Excel 本身已有的銷售抽數。
  const excelSalesDraws=new Map();
  for(const sr of excelSales)if(sr.bundle_code)excelSalesDraws.set(sr.bundle_code,(excelSalesDraws.get(sr.bundle_code)||0)+Number(sr.draws||0));

  let bundleNew=0,bundleUpdated=0,bundleSkipped=0;
  const bundleWrites=[];
  for(const eb of excelBundles){
   const old=dbBundleMap.get(eb.code);
   const baseline=Math.max(0,Number(eb.excel_done||0)-Number(excelSalesDraws.get(eb.code)||0));
   if(!old){
    bundleWrites.push({owner_id:ownerId,code:eb.code,product_name:eb.product_name,bundle_date:eb.bundle_date,cost:eb.cost??0,draw_target:eb.draw_target,historical_draws:baseline,total_draw_target:eb.total_draw_target,status:eb.excel_status||'進行中',price:eb.price,end_date:eb.end_date});
    bundleNew++;continue;
   }
   // Merge：保護網站上維護的狀態／結束日期；空白 Excel 不覆蓋；歷史刮數只能增加。
   const merged={
    owner_id:ownerId,code:old.code,
    product_name:eb.product_name||old.product_name,
    bundle_date:eb.bundle_date||old.bundle_date,
    cost:eb.cost==null?old.cost:eb.cost,
    draw_target:eb.draw_target==null?old.draw_target:eb.draw_target,
    historical_draws:Math.max(Number(old.historical_draws||0),baseline),
    total_draw_target:eb.total_draw_target==null?old.total_draw_target:eb.total_draw_target,
    status:old.status,
    price:eb.price==null?old.price:eb.price,
    end_date:old.end_date
   };
   const changed=['product_name','bundle_date','cost','draw_target','historical_draws','total_draw_target','price'].some(k=>String(merged[k]??'')!==String(old[k]??''));
   if(changed){bundleWrites.push(merged);bundleUpdated++;}else bundleSkipped++;
  }
  if(bundleWrites.length){
   status.textContent=`套組差異：新增 ${bundleNew}、更新 ${bundleUpdated}、略過 ${bundleSkipped}。寫入中…`;
   const q=await sb.from('bundles').upsert(bundleWrites,{onConflict:'owner_id,code'});if(q.error)throw q.error;
  }

  // 重新取套組 ID，供新增銷售關聯。
  const {data:freshBundles,error:fbe}=await sb.from('bundles').select('id,code,product_name').eq('owner_id',ownerId);if(fbe)throw fbe;
  const idMap=new Map((freshBundles||[]).map(x=>[x.code,x]));
  for(const sr of excelSales)sr.bundle_id=sr.bundle_code&&idMap.has(sr.bundle_code)?idMap.get(sr.bundle_code).id:null;

  const {data:dbSales,error:se}=await sb.from('sales').select('id,sale_date,bundle_code,product_name,draws,unit_price,discount,payment_method,entered_by,note,import_source_key').eq('owner_id',ownerId);
  if(se)throw se;
  const exactKeys=new Set((dbSales||[]).map(x=>x.import_source_key).filter(Boolean));
  const candidateMap=new Map();
  const stableKey=x=>[x.sale_date||'',x.bundle_code||'',x.entered_by||'',x.note||''].join('\u001f');
  for(const x of dbSales||[]){const k=stableKey(x);if(!candidateMap.has(k))candidateMap.set(k,[]);candidateMap.get(k).push(x);}

  let saleNew=0,saleUpdated=0,saleSkipped=0,saleConflicts=0;
  const saleInserts=[],saleUpdates=[];
  for(const sr of excelSales){
   if(exactKeys.has(sr.import_source_key)){saleSkipped++;continue;}
   const candidates=candidateMap.get(stableKey(sr))||[];
   // 僅在候選唯一時，才視為同一筆舊銷售的修改；避免誤改同日多筆訂單。
   if(candidates.length===1){
    const old=candidates[0];
    const differs=['product_name','draws','unit_price','discount','payment_method'].some(k=>String(old[k]??'')!==String(sr[k]??''));
    if(differs){saleUpdates.push({...sr,id:old.id});saleUpdated++;}else saleSkipped++;
   }else if(candidates.length>1){
    saleConflicts++;
   }else{saleInserts.push(sr);saleNew++;}
  }

  for(const u of saleUpdates){
   const {id,...payload}=u;
   const q=await sb.from('sales').update(payload).eq('id',id);if(q.error)throw q.error;
  }
  for(let i=0;i<saleInserts.length;i+=100){
   const chunk=saleInserts.slice(i,i+100);const q=await sb.from('sales').insert(chunk);if(q.error)throw q.error;
  }

  const msg=`差異同步完成｜套組：新增 ${bundleNew}、更新 ${bundleUpdated}、略過 ${bundleSkipped}｜銷售：新增 ${saleNew}、更新 ${saleUpdated}、略過 ${saleSkipped}、衝突 ${saleConflicts}`;
  status.textContent=msg+(saleConflicts?'。衝突資料未自動寫入，避免誤覆蓋。':'');
  toast(msg);
  setTimeout(async()=>{closeModal();await loadAll()},900);
 }catch(err){status.textContent='同步失敗：'+(err.message||err);toast(err.message||'Excel 差異同步失敗')}
}

function settlementCount(ownerId,month){return ownerSettlements.filter(x=>x.owner_id===ownerId&&reportMonthKey(x.report_month)===month).length}
function settlementRows(ownerId,month){return ownerSettlements.filter(x=>x.owner_id===ownerId&&reportMonthKey(x.report_month)===month).slice().sort((a,b)=>String(b.settled_at||'').localeCompare(String(a.settled_at||'')))}
function monthlyExpenseTotal(ownerId,month){return ownerExpenses.filter(x=>x.owner_id===ownerId&&reportMonthKey(x.report_month)===month).reduce((a,x)=>a+Number(x.amount||0),0)}

async function addMonthlyExpense(ownerId,month){

function fmtDateTime(v){if(!v)return '—';try{return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}}
async function settleOwnerPayout(ownerId,month){
 const eligibleRevenue=commissionRevenue(ownerId,month);
 const misc=monthlyExpenseTotal(ownerId,month);
 const ownerDue=Math.max(0,Math.round((eligibleRevenue*0.90-misc)*100)/100);
 const alreadyPaid=paidToOwner(ownerId,month);
 const outstanding=Math.max(0,Math.round((ownerDue-alreadyPaid)*100)/100);
 if(outstanding<=0)return toast('本月份目前沒有尚欠老闆的款項');
 if(!confirm(`${ownerName(ownerId)}｜${month}\n確認已支付老闆 ${money(outstanding)}？`))return;
 const q=await sb.rpc('settle_monthly_owner_payout',{p_owner_id:ownerId,p_report_month:month+'-01',p_note:'網站月結已結'});
 if(q.error)return toast(q.error.message);
 const c=await sb.from('monthly_owner_settlements').select('*').order('settled_at',{ascending:false});
 if(c.error)return toast(c.error.message);
 ownerSettlements=c.data||[];toast(`已結清 ${money(outstanding)}`);renderMonthlyReports();
}

function renderOwnerManager(){
 document.getElementById('pageTitle').textContent='老闆管理';
 document.getElementById('pageSubtitle').textContent=isEngineer()?'總管理區｜管理老闆編碼、帳本狀態與寄抽到期日':'總管理區｜可查看老闆資料並修改寄抽到期日';
 document.getElementById('content').innerHTML=`<div class="section" style="border-color:#cfe0f3;background:linear-gradient(135deg,#f8fbff,#ffffff)"><div style="font-size:13px;color:#52657c"><b style="color:#173b64">總管理模式</b>　此頁不受左側老闆篩選影響。若點選左側任一老闆，系統會自動回到該老闆的營運總覽。</div></div><div class="section"><div class="section-head"><h2>老闆管理</h2>${isEngineer()?'<button class="btn primary" onclick="addOwner()">＋ 新增老闆</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>編碼</th><th>名稱</th><th>寄抽到期日</th><th>到期狀態</th><th>帳號狀態</th><th>套組</th><th>銷售</th><th>操作</th></tr></thead><tbody>${owners.map(o=>`<tr><td><b>${esc(o.owner_code||'未設定')}</b></td><td><b>${esc(o.name)}</b></td><td>${esc(fmtDate(o.draw_expiry_date))}</td><td>${expiryPill(o.draw_expiry_date)}</td><td>${ownerOperational(o)?'<span class="pill ok">啟用</span>':'<span class="pill bad">已停用</span>'}</td><td>${bundles.filter(b=>b.owner_id===o.id).length}</td><td>${sales.filter(s=>s.owner_id===o.id).length}</td><td><button class="btn" onclick="editOwnerExpiry('${o.id}')">設定到期日</button>${isEngineer()?` <button class="btn" onclick="editOwner('${o.id}')">編輯</button> <button class="btn" onclick="toggleOwner('${o.id}',${!o.active})">${o.active?'停用':'啟用'}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`
}
async function showOwnerManager(){setView('owners')}
async function editOwnerExpiry(id){const o=owners.find(x=>x.id===id);if(!o)return;document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>設定寄抽到期日｜${esc(o.name)}</h3><button class="btn" onclick="closeModal()">關閉</button></div><div class="field"><label>寄抽到期日</label><input id="owner_expiry_date" type="date" value="${esc(o.draw_expiry_date||'')}"></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary" type="button" onclick="saveOwnerExpiry('${id}')">儲存</button></div></div>`;document.getElementById('modal').style.display='flex'}
async function saveOwnerExpiry(id){const d=document.getElementById('owner_expiry_date').value||null;const q=await sb.rpc('update_owner_expiry',{p_owner_id:id,p_expiry_date:d});if(q.error)return toast(q.error.message);toast('寄抽到期日已更新');closeModal();await loadAll()}
function addOwner(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>新增老闆</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveNewOwner(event)"><div class="form-grid"><div class="field"><label>老闆名稱</label><input id="new_owner_name" required></div><div class="field"><label>英文編碼</label><input id="new_owner_code" maxlength="8" placeholder="例如 B" style="text-transform:uppercase" required></div><div class="field"><label>寄抽到期日</label><input id="new_owner_expiry" type="date"></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">新增</button></div></form></div>`;document.getElementById('modal').style.display='flex'}
async function saveNewOwner(e){e.preventDefault();const name=new_owner_name.value.trim();const code=new_owner_code.value.trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{0,7}$/.test(code))return toast('英文編碼需以英文字母開頭，最多 8 碼');const max=Math.max(0,...owners.map(x=>x.display_order||0));const q=await sb.from('owners').insert({name,owner_code:code,draw_expiry_date:new_owner_expiry.value||null,display_order:max+1,active:true});if(q.error)return toast(q.error.message);toast('老闆已新增');closeModal();await loadAll()}
function editOwner(id){if(!isEngineer())return;const o=owners.find(x=>x.id===id);if(!o)return;document.getElementById('modal').innerHTML=`<div class="modal"><div class="section-head"><h3>編輯老闆</h3><button class="btn" onclick="closeModal()">關閉</button></div><form onsubmit="saveOwnerEdit(event,'${id}')"><div class="form-grid"><div class="field"><label>老闆名稱</label><input id="edit_owner_name" value="${esc(o.name)}" required></div><div class="field"><label>英文編碼</label><input id="edit_owner_code" maxlength="8" value="${esc(o.owner_code||'')}" style="text-transform:uppercase" required></div></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary">儲存</button></div></form></div>`;document.getElementById('modal').style.display='flex'}
async function saveOwnerEdit(e,id){e.preventDefault();const code=edit_owner_code.value.trim().toUpperCase();if(!/^[A-Z][A-Z0-9_-]{0,7}$/.test(code))return toast('英文編碼格式錯誤');const q=await sb.from('owners').update({name:edit_owner_name.value.trim(),owner_code:code}).eq('id',id);if(q.error)return toast(q.error.message);toast('老闆資料已更新');closeModal();await loadAll()}
async function toggleOwner(id,active){const q=await sb.from('owners').update({active}).eq('id',id);if(q.error)return toast(q.error.message);await loadAll()}
window.addEventListener('load',init);
</script>
</body></html>
